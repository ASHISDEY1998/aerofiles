<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AeroFiles Home</title>
  
  <!-- Apple iOS Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AeroFiles">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-header">
    <div class="brand-section" id="brandBtn">
      <img src="/static/icon.png" alt="AeroFiles" class="brand-logo">
      <span class="brand-title">AeroFiles</span>
    </div>

    <div class="header-search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search files in current folder...">
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary btn-icon" id="toggleViewBtn" title="Toggle List / Grid view">
        <svg id="viewIconGrid" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <svg id="viewIconList" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
      </button>

      <button class="btn btn-secondary" id="newFolderBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          <line x1="12" y1="11" x2="12" y2="17"></line>
          <line x1="9" y1="14" x2="15" y2="14"></line>
        </svg>
        <span>New Folder</span>
      </button>

      <button class="btn btn-primary" id="uploadBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span>Upload</span>
      </button>
      <input type="file" id="fileUploadInput" multiple style="display: none;">
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">
    
    <!-- Storage Capacity Card -->
    <section class="storage-banner" id="storageBanner">
      <div class="storage-info">
        <div class="storage-icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            <line x1="6" y1="6" x2="6.01" y2="6"></line>
            <line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
        </div>
        <div class="storage-meta">
          <h4 id="storageName">Home Server Storage</h4>
          <p id="storageSubtitle">Calculating disk usage...</p>
        </div>
      </div>

      <div class="storage-bar-wrapper">
        <div class="storage-bar-bg">
          <div class="storage-bar-fill" id="storageBarFill" style="width: 0%;"></div>
        </div>
        <div class="storage-labels">
          <span id="storageUsedLabel">Used: --</span>
          <span id="storageFreeLabel">Free: --</span>
        </div>
      </div>
    </section>

    <!-- Breadcrumb Path Navigator -->
    <nav class="breadcrumb-nav" id="breadcrumbNav">
      <!-- Breadcrumbs injected dynamically -->
    </nav>

    <!-- Toolbar & Stats -->
    <div class="view-toolbar">
      <span class="items-counter" id="itemsCount">Loading...</span>
    </div>

    <!-- File Browser Grid -->
    <div class="file-grid" id="fileGrid">
      <!-- Files & Folders injected dynamically -->
    </div>

    <!-- File Browser List (hidden by default) -->
    <div class="file-list" id="fileList" style="display: none;">
      <!-- Files & Folders injected dynamically -->
    </div>

  </main>

  <!-- Universal Video Player Overlay (Apple tvOS Style) -->
  <div class="video-modal-overlay" id="videoModal">
    <div class="video-top-bar" id="videoTopBar">
      <button class="video-action-btn" id="closeVideoBtn" title="Close Video">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <span class="video-title" id="videoTitle">Video Title</span>
      <div style="width: 32px;"></div>
    </div>

    <div class="video-player-container">
      <video id="mainVideoPlayer" playsinline webkit-playsinline></video>
    </div>

    <div class="video-controls-bar" id="videoControlsBar">
      <div class="video-scrubber-row">
        <span class="time-display" id="videoCurrentTime">0:00</span>
        <input type="range" class="scrubber-slider" id="videoScrubber" min="0" max="100" value="0" step="0.1">
        <span class="time-display" id="videoDuration">0:00</span>
      </div>

      <div class="video-buttons-row">
        <div class="video-btn-group">
          <button class="video-action-btn" id="videoSkipBackBtn" title="Back 10s">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 4v6h6"></path>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              <text x="9" y="15" font-size="8" fill="currentColor" stroke="none" font-weight="bold">10</text>
            </svg>
          </button>

          <button class="video-action-btn" id="videoPlayPauseBtn" title="Play/Pause">
            <svg id="videoPlayIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg id="videoPauseIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>

          <button class="video-action-btn" id="videoSkipForwardBtn" title="Forward 10s">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 4v6h-6"></path>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
              <text x="8" y="15" font-size="8" fill="currentColor" stroke="none" font-weight="bold">10</text>
            </svg>
          </button>
        </div>

        <div class="video-btn-group">
          <select class="speed-select" id="videoSpeedSelect">
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2.0">2.0x</option>
          </select>

          <button class="video-action-btn" id="videoPipBtn" title="Picture in Picture">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <rect x="12" y="12" width="8" height="6" rx="1"></rect>
            </svg>
          </button>

          <button class="video-action-btn" id="videoFullscreenBtn" title="Fullscreen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Audio Player Bar -->
  <div class="audio-player-bar" id="audioPlayerBar">
    <audio id="mainAudioPlayer"></audio>
    <button class="video-action-btn" id="audioPlayPauseBtn">
      <svg id="audioPlayIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <svg id="audioPauseIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
    </button>
    <div class="audio-track-info">
      <div class="audio-track-title" id="audioTrackTitle">Audio Track</div>
      <div class="audio-track-time" id="audioTrackTime">0:00 / 0:00</div>
    </div>
    <button class="video-action-btn" id="closeAudioBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Image Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal">
    <button class="video-action-btn" id="closeLightboxBtn" style="position: absolute; top: calc(20px + var(--safe-top)); right: 24px; z-index: 10;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Preview">
  </div>

  <!-- New Folder Modal -->
  <div class="modal-overlay" id="newFolderModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Create New Folder</h3>
        <button class="modal-close-btn" id="closeNewFolderBtn">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="newFolderNameInput" class="modal-input" placeholder="Folder name..." autofocus>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelNewFolderBtn">Cancel</button>
        <button class="btn btn-primary" id="confirmNewFolderBtn">Create</button>
      </div>
    </div>
  </div>

  <!-- Rename Item Modal -->
  <div class="modal-overlay" id="renameModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Rename Item</h3>
        <button class="modal-close-btn" id="closeRenameBtn">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="renameInput" class="modal-input" placeholder="New name...">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelRenameBtn">Cancel</button>
        <button class="btn btn-primary" id="confirmRenameBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- Drag and Drop Overlay -->
  <div class="dropzone-overlay" id="dropzoneOverlay">
    <div class="dropzone-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <h3>Drop files to upload to Home Server</h3>
      <p style="color: var(--text-secondary); font-size: 13px;">High-speed LAN direct upload</p>
    </div>
  </div>

  <!-- Upload Progress Floating Box -->
  <div class="upload-progress-box" id="uploadProgressBox">
    <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:600;">
      <span id="uploadStatusText">Uploading files...</span>
      <span id="uploadPercentText">0%</span>
    </div>
    <div class="storage-bar-bg">
      <div class="storage-bar-fill" id="uploadProgressFill" style="width: 0%;"></div>
    </div>
  </div>

  <!-- Context Menu -->
  <div class="context-menu" id="contextMenu">
    <div class="context-item" id="ctxDownload">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span>Download</span>
    </div>
    <div class="context-item" id="ctxRename">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
      </svg>
      <span>Rename</span>
    </div>
    <div class="context-item danger" id="ctxDelete">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
      <span>Delete</span>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
